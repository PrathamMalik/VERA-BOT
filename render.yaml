services:
  - type: web
    name: vera-bot
    runtime: python
    plan: free
    buildCommand: "echo no build needed"
    startCommand: "python bot.py"
    healthCheckPath: /v1/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_RPM
        value: "12"
      - key: LLM_API_KEY
        sync: false        # paste your key in the Render dashboard, never in code
      - key: TEAM_NAME
        sync: false
      - key: TEAM_MEMBERS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
